<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>격투가 VS 중세 로마 전사 — 3D 배틀 시뮬레이터</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; font-family:'Trebuchet MS','맑은 고딕',sans-serif; }
  #app { position:relative; width:100vw; height:100vh; }
  canvas { display:block; }

  /* ---- HUD ---- */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; }

  .fighter-bar {
    position:absolute; top:24px; width:38%; }
  .fighter-bar.left  { left:2.5%; text-align:left; }
  .fighter-bar.right { right:2.5%; text-align:right; }
  .fighter-bar .name {
    font-size:22px; font-weight:bold; letter-spacing:1px;
    color:#fff; text-shadow:0 2px 6px #000, 0 0 12px currentColor;
    margin-bottom:6px; }
  .left  .name { color:#ff5a4d; }
  .right .name { color:#ffd35a; }
  .hpwrap {
    position:relative; height:26px; border:2px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.55); border-radius:4px; overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.6); }
  .hpfill { position:absolute; top:0; bottom:0; transition:width .18s cubic-bezier(.2,.8,.2,1); }
  .left  .hpfill { left:0;  background:linear-gradient(90deg,#ff3b2f,#ff8a5a); }
  .right .hpfill { right:0; background:linear-gradient(270deg,#ffcf33,#ffe98a); }
  .hpghost { position:absolute; top:0; bottom:0; background:rgba(255,255,255,.35);
    transition:width .55s ease .12s; }
  .left  .hpghost { left:0; }
  .right .hpghost { right:0; }
  .hptext { position:absolute; top:50%; transform:translateY(-50%);
    font-size:13px; font-weight:bold; color:#fff; text-shadow:0 1px 3px #000; padding:0 8px; }
  .left  .hptext { right:6px; }
  .right .hptext { left:6px; }

  #vs { position:absolute; top:30px; left:50%; transform:translateX(-50%);
    font-size:40px; font-weight:900; color:#fff; font-style:italic;
    text-shadow:0 0 18px #ff3b2f,0 3px 0 #000; }
  #timer { position:absolute; top:78px; left:50%; transform:translateX(-50%);
    font-size:26px; font-weight:bold; color:#fff; text-shadow:0 2px 6px #000; }

  /* combat log */
  #log { position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
    width:min(560px,86%); text-align:center; }
  .logline { font-size:18px; color:#fff; font-weight:bold; margin:3px 0;
    text-shadow:0 2px 5px #000; opacity:0; animation:logIn .35s forwards; }
  @keyframes logIn { from{opacity:0;transform:translateY(10px) scale(.9);} to{opacity:1;transform:none;} }

  /* damage numbers layer */
  #dmglayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .dmg { position:absolute; font-weight:900; font-style:italic;
    text-shadow:0 2px 4px #000,0 0 10px currentColor; will-change:transform,opacity;
    animation:dmgPop 0.9s ease-out forwards; }
  @keyframes dmgPop {
    0%   { transform:translate(-50%,0) scale(.4); opacity:0; }
    18%  { transform:translate(-50%,-34px) scale(1.35); opacity:1; }
    100% { transform:translate(-50%,-96px) scale(1); opacity:0; }
  }

  /* announce banner */
  #announce { position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
    font-size:88px; font-weight:900; font-style:italic; color:#fff; text-align:center;
    text-shadow:0 0 30px #ff3b2f,0 6px 0 #000,0 0 60px #ff3b2f; opacity:0; white-space:nowrap; }
  #announce.show { animation:announceIn 1.1s cubic-bezier(.1,1.4,.3,1) forwards; }
  @keyframes announceIn {
    0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-6deg);}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg);}
    82%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);}
  }

  /* ---- start / result panels ---- */
  #overlay { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px;
    background:radial-gradient(ellipse at center,rgba(20,10,30,.55),rgba(3,4,8,.92)); }
  #title { text-align:center; }
  #title h1 { font-size:min(7vw,72px); font-weight:900; font-style:italic; color:#fff; line-height:1.05;
    text-shadow:0 0 26px #ff3b2f,0 5px 0 #000; }
  #title h1 .g { color:#ff5a4d; }
  #title h1 .r { color:#ffd35a; }
  #title p { margin-top:14px; color:#c9c9d6; font-size:18px; }
  .btn { pointer-events:auto; cursor:pointer; border:none; border-radius:50px;
    padding:18px 54px; font-size:24px; font-weight:900; font-style:italic; color:#fff;
    background:linear-gradient(135deg,#ff3b2f,#ff8a3b); letter-spacing:1px;
    box-shadow:0 10px 30px rgba(255,59,47,.5),inset 0 2px 0 rgba(255,255,255,.4);
    transition:transform .12s, box-shadow .12s; text-transform:uppercase; }
  .btn:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 16px 40px rgba(255,59,47,.7); }
  .btn:active { transform:translateY(1px) scale(.98); }
  .hidden { display:none !important; }
  #resultText { font-size:min(9vw,96px); font-weight:900; font-style:italic; text-align:center;
    text-shadow:0 0 40px currentColor,0 6px 0 #000; }
  #hint { position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    color:#8a8a9a; font-size:13px; z-index:11; text-shadow:0 1px 3px #000; }
  #loading { color:#fff; font-size:20px; }
</style>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. 사운드 — WebAudio 실시간 합성 (외부 파일 없음)
   ============================================================ */
const Sound = (() => {
  let ctx = null, master = null;
  function init(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  }
  function now(){ return ctx.currentTime; }
  function noiseBuffer(dur){
    const n = Math.floor(ctx.sampleRate*dur), b = ctx.createBuffer(1,n,ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    return b;
  }
  function env(g,t,a,d,peak){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }

  // 펀치: 저역 thump + 짧은 노이즈
  function punch(v=1){
    if(!ctx) return; const t=now();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(55,t+0.12);
    env(g,t,0.005,0.13,0.9*v); o.connect(g).connect(master); o.start(t); o.stop(t+0.2);
    const ns=ctx.createBufferSource(); ns.buffer=noiseBuffer(0.09);
    const nf=ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=1200;
    const ng=ctx.createGain(); env(ng,t,0.002,0.08,0.5*v);
    ns.connect(nf).connect(ng).connect(master); ns.start(t); ns.stop(t+0.1);
  }
  // 검격 명중: 살점 타격 + 금속 잔향
  function slash(v=1){
    if(!ctx) return; const t=now();
    const ns=ctx.createBufferSource(); ns.buffer=noiseBuffer(0.18);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(2600,t);
    bp.frequency.exponentialRampToValueAtTime(600,t+0.15); bp.Q.value=1.2;
    const g=ctx.createGain(); env(g,t,0.003,0.16,0.75*v);
    ns.connect(bp).connect(g).connect(master); ns.start(t); ns.stop(t+0.2);
  }
  // 검 vs 방패/검 = 금속 챙!
  function clang(v=1){
    if(!ctx) return; const t=now();
    [1568,2093,3136].forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='square'; o.frequency.setValueAtTime(f*(1+ (Math.random()*0.02-0.01)),t);
      env(g,t,0.001,0.35-i*0.07,0.28*v/(i+1));
      o.connect(g).connect(master); o.start(t); o.stop(t+0.4);
    });
    const ns=ctx.createBufferSource(); ns.buffer=noiseBuffer(0.05);
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000;
    const ng=ctx.createGain(); env(ng,t,0.001,0.04,0.4*v);
    ns.connect(hp).connect(ng).connect(master); ns.start(t); ns.stop(t+0.06);
  }
  // 휘두르는 바람소리
  function whoosh(v=1){
    if(!ctx) return; const t=now();
    const ns=ctx.createBufferSource(); ns.buffer=noiseBuffer(0.22);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(500,t); bp.frequency.exponentialRampToValueAtTime(2400,t+0.18); bp.Q.value=0.7;
    const g=ctx.createGain(); env(g,t,0.03,0.18,0.3*v);
    ns.connect(bp).connect(g).connect(master); ns.start(t); ns.stop(t+0.24);
  }
  // 발구르기/스텝
  function step(v=1){
    if(!ctx) return; const t=now();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(40,t+0.08);
    env(g,t,0.002,0.09,0.35*v); o.connect(g).connect(master); o.start(t); o.stop(t+0.12);
  }
  // KO 공(gong)
  function gong(){
    if(!ctx) return; const t=now();
    [110,146,220,293].forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.4/(i+1),t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
      o.connect(g).connect(master); o.start(t); o.stop(t+2.3);
    });
  }
  // 군중 함성 (필터드 노이즈 스웰)
  function crowd(v=1,dur=1.4){
    if(!ctx) return; const t=now();
    const ns=ctx.createBufferSource(); ns.buffer=noiseBuffer(dur); ns.loop=false;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.5;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.22*v,t+0.4);
    g.gain.linearRampToValueAtTime(0.14*v,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    ns.connect(bp).connect(g).connect(master); ns.start(t); ns.stop(t+dur);
  }
  // 낮은 긴장감 드론 (배경)
  function bell(){ if(!ctx) return; const t=now();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle'; o.frequency.value=196; env(g,t,0.01,1.2,0.25);
    o.connect(g).connect(master); o.start(t); o.stop(t+1.4);
  }
  return { init, punch, slash, clang, whoosh, step, gong, crowd, bell,
           resume:()=>ctx&&ctx.resume() };
})();

/* ============================================================
   1. 씬 · 카메라 · 렌더러 · 조명
   ============================================================ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0710);
scene.fog = new THREE.Fog(0x0a0710, 22, 55);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
const camBase = new THREE.Vector3(0, 6.2, 15.5);
camera.position.copy(camBase);
camera.lookAt(0, 2.4, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.insertBefore(renderer.domElement, app.firstChild);

// 조명: 따뜻한 석양 + 아레나 스팟
const hemi = new THREE.HemisphereLight(0xffd9a0, 0x241018, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe0b0, 2.1);
sun.position.set(-8, 18, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-16; sun.shadow.camera.right=16;
sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
sun.shadow.camera.near=1; sun.shadow.camera.far=50; sun.shadow.bias=-0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6a7bff, 0.8); rim.position.set(9,8,-10); scene.add(rim);
const spot = new THREE.SpotLight(0xfff2d0, 60, 40, Math.PI/4, 0.4, 1.2);
spot.position.set(0, 20, 6); spot.target.position.set(0,0,0);
scene.add(spot); scene.add(spot.target);

/* ---- 아레나 ---- */
const arena = new THREE.Group(); scene.add(arena);
// 모래 바닥
const groundMat = new THREE.MeshStandardMaterial({ color:0xb99160, roughness:1 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; arena.add(ground);
// 모래 링 문양
const ring = new THREE.Mesh(new THREE.RingGeometry(9.4, 9.8, 64),
  new THREE.MeshStandardMaterial({ color:0x8a6a44, roughness:1 }));
ring.rotation.x=-Math.PI/2; ring.position.y=0.01; arena.add(ring);
// 콜로세움 벽 + 관중석
const wallMat = new THREE.MeshStandardMaterial({ color:0x6d5844, roughness:0.9 });
const wall = new THREE.Mesh(new THREE.CylinderGeometry(14.2,14.2,3.2,64,1,true), wallMat);
wall.position.y=1.6; wall.material.side=THREE.BackSide; arena.add(wall);
// 관중석 계단 + 관중(작은 박스들)
const standMat = new THREE.MeshStandardMaterial({ color:0x4a3a2c, roughness:1 });
const crowdColors = [0xcc5555,0x5566cc,0xccaa55,0x55aa77,0xaa66bb,0xdddddd];
for(let tier=0; tier<3; tier++){
  const r = 14.4 + tier*1.5, y = 3.2 + tier*1.4;
  const step = new THREE.Mesh(new THREE.CylinderGeometry(r+0.8,r+0.8,1.2,64,1,true), standMat);
  step.position.y=y; step.material.side=THREE.DoubleSide; arena.add(step);
  const count = 60 + tier*10;
  const dummy = new THREE.Object3D();
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(0.4,0.7,0.4),
    new THREE.MeshStandardMaterial({ roughness:1 }), count);
  for(let i=0;i<count;i++){
    const a = (i/count)*Math.PI*2 + tier*0.1;
    dummy.position.set(Math.cos(a)*r, y+0.9, Math.sin(a)*r);
    dummy.rotation.y = -a + Math.PI/2;
    dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
    im.setColorAt(i, new THREE.Color(crowdColors[(i*7+tier)%crowdColors.length]));
  }
  im.castShadow=false; arena.add(im);
  im.userData.baseY = []; // for cheer bounce
}
// 기둥
const pillarMat = new THREE.MeshStandardMaterial({ color:0xcfc4b0, roughness:0.8 });
for(let i=0;i<10;i++){
  const a=(i/10)*Math.PI*2;
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,7,16), pillarMat);
  p.position.set(Math.cos(a)*13.2, 3.5, Math.sin(a)*13.2); p.castShadow=true; arena.add(p);
}

/* ============================================================
   2. 캐릭터 빌더 (프리미티브 조합 + 사지 애니메이션)
   ============================================================ */
function mat(c,r=0.6,m=0){ return new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m }); }
function limb(w,h,d,c,r,mt){ const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c,r,mt)); g.castShadow=true; return g; }

function makeFighter(skin, facing){
  // 격투가: 날렵, 빨간 헤드밴드, 복싱 글러브, 도복바지
  const g = new THREE.Group();
  const parts = {};
  const torso = limb(1.05,1.5,0.6, 0xf2c9a0); torso.position.y=2.7; // 피부색 상체(민소매)
  const chest = limb(1.1,0.7,0.65, 0x3a3f4a); chest.position.y=3.05; // 조끼
  const pelvis = limb(1.0,0.55,0.6, 0x222831); pelvis.position.y=1.95;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.45,20,16), mat(skin)); head.position.y=3.85; head.castShadow=true;
  const band = limb(0.95,0.18,0.95, 0xd83a2a); band.position.y=3.98;
  const bandTail = limb(0.12,0.5,0.1,0xd83a2a); bandTail.position.set(-0.45,3.8,-0.2); bandTail.rotation.z=0.3;
  // 팔
  const armLU = limb(0.32,0.75,0.32, 0xf2c9a0); armLU.position.set(-0.75,3.0,0);
  const armLF = limb(0.30,0.7,0.30, 0xf2c9a0);
  const gloveL = new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12), mat(0xd83a2a));
  const armRU = limb(0.32,0.75,0.32, 0xf2c9a0); armRU.position.set(0.75,3.0,0);
  const armRF = limb(0.30,0.7,0.30, 0xf2c9a0);
  const gloveR = new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12), mat(0xd83a2a));
  // 다리
  const legLU = limb(0.4,0.85,0.42, 0x222831); legLU.position.set(-0.32,1.35,0);
  const legLF = limb(0.36,0.8,0.38, 0x222831);
  const legRU = limb(0.4,0.85,0.42, 0x222831); legRU.position.set(0.32,1.35,0);
  const legRF = limb(0.36,0.8,0.38, 0x222831);
  // 관절 그룹 (회전 피벗을 위해 상단 정렬)
  const jArmL=new THREE.Group(); jArmL.position.set(-0.62,3.35,0);
  armLU.position.set(0,-0.4,0); const jArmLF=new THREE.Group(); jArmLF.position.set(0,-0.75,0);
  armLF.position.set(0,-0.35,0); gloveL.position.set(0,-0.72,0);
  jArmLF.add(armLF,gloveL); jArmL.add(armLU,jArmLF);
  const jArmR=new THREE.Group(); jArmR.position.set(0.62,3.35,0);
  armRU.position.set(0,-0.4,0); const jArmRF=new THREE.Group(); jArmRF.position.set(0,-0.75,0);
  armRF.position.set(0,-0.35,0); gloveR.position.set(0,-0.72,0);
  jArmRF.add(armRF,gloveR); jArmR.add(armRU,jArmRF);
  const jLegL=new THREE.Group(); jLegL.position.set(-0.32,1.75,0);
  legLU.position.set(0,-0.45,0); const jLegLF=new THREE.Group(); jLegLF.position.set(0,-0.85,0);
  legLF.position.set(0,-0.4,0); jLegLF.add(legLF); jLegL.add(legLU,jLegLF);
  const jLegR=new THREE.Group(); jLegR.position.set(0.32,1.75,0);
  legRU.position.set(0,-0.45,0); const jLegRF=new THREE.Group(); jLegRF.position.set(0,-0.85,0);

/* ============================================================
   3. 파이터 컨트롤러 (상태머신 · 애니메이션 · 체력)
   ============================================================ */
class Combatant {
  constructor(build, opts){
    this.build=build; this.g=build.group; this.parts=build.parts; this.type=build.type;
    scene.add(this.g);
    this.name=opts.name; this.side=opts.side; this.homeX=opts.x; this.dir=opts.dir; // dir: +1 이면 상대가 오른쪽
    this.g.position.set(opts.x,0,0);
    this.hp=100; this.maxHp=100;
    this.state='idle'; this.t=0; this.anim=0; this.cooldown= opts.side==='L'?0.6:0.9;
    this.reach = this.type==='roman'?4.4:3.6;
    this.speed = this.type==='roman'?3.0:4.0;
    this.dmgMin = this.type==='roman'?11:8;
    this.dmgMax = this.type==='roman'?20:15;
    this.critChance = this.type==='roman'?0.18:0.28;
    this.walkPhase=Math.random()*6;
    this.currentMove=null;
  }
  get x(){ return this.g.position.x; }
  faceTo(x){ this.g.rotation.y = x>this.x ? Math.PI/2 : -Math.PI/2; }
  setIdle(){ this.state='idle'; this.t=0; }

  takeHit(dmg, crit, fromX){
    this.hp=Math.max(0,this.hp-dmg);
    this.state='hurt'; this.t=0;
    // 넉백 방향
    this.knock = (this.x<fromX?-1:1)*(crit?3.2:1.8);
    if(this.hp<=0){ this.state='ko'; this.t=0; }
  }

  // ---- 애니메이션 포즈 헬퍼 ----
  reset(){
    const p=this.parts;
    p.jArmL.rotation.set(0,0,0); p.jArmR.rotation.set(0,0,0);
    p.jArmLF.rotation.set(0,0,0); p.jArmRF.rotation.set(0,0,0);
    p.jLegL.rotation.set(0,0,0); p.jLegR.rotation.set(0,0,0);
    p.jLegLF.rotation.set(0,0,0); p.jLegRF.rotation.set(0,0,0);
    p.head.rotation.set(0,0,0); this.g.rotation.z=0;
  }

  update(dt, foe){
    this.t+=dt; this.anim+=dt;
    const p=this.parts;
    // 사망 처리
    if(this.state==='ko'){ this.reset();
      const k=Math.min(1,this.t*1.6);
      this.g.rotation.z = this.dir*(-Math.PI/2*k);
      this.g.position.y = -Math.sin(k*Math.PI)*0.4;
      p.head.rotation.x=0.4*k;
      return;
    }
    this.reset();
    this.g.position.y=0;

    switch(this.state){
      case 'idle': this.poseIdle(); break;
      case 'approach': this.poseWalk(); this.moveToward(foe,dt); break;
      case 'retreat': this.poseWalk(0.7); this.moveAway(foe,dt); break;
      case 'windup': this.poseWindup(); break;
      case 'attack': this.poseAttack(foe); break;
      case 'recover': this.poseIdle(); break;
      case 'hurt': this.poseHurt(dt); break;
      case 'block': this.poseBlock(); break;
    }
  }
  poseIdle(){
    const p=this.parts, b=Math.sin(this.anim*2.2);
    this.g.position.y=Math.abs(Math.sin(this.anim*2.2))*0.06;
    if(this.type==='fighter'){ // 복싱 가드
      p.jArmL.rotation.x=-1.7; p.jArmLF.rotation.x=-1.4; p.jArmL.rotation.z=0.3;
      p.jArmR.rotation.x=-1.6; p.jArmRF.rotation.x=-1.5; p.jArmR.rotation.z=-0.3;
      p.jArmL.rotation.x+=b*0.08; p.jArmR.rotation.x-=b*0.08;
    } else { // 검·방패 가드
      p.jArmL.rotation.x=-0.5; p.jArmLF.rotation.x=-0.9; // 방패 앞
      p.jArmR.rotation.x=-0.3; p.jArmR.rotation.z=-0.2;
      p.jArmL.rotation.x+=b*0.05;
    }
    p.jLegL.rotation.x=0.12; p.jLegR.rotation.x=-0.12;
  }
  poseWalk(sp=1){
    const p=this.parts, s=Math.sin(this.anim*10*sp);
    this.g.position.y=Math.abs(Math.sin(this.anim*10*sp))*0.1;
    p.jLegL.rotation.x=s*0.7; p.jLegR.rotation.x=-s*0.7;
    p.jLegLF.rotation.x=Math.max(0,-s)*0.6; p.jLegRF.rotation.x=Math.max(0,s)*0.6;
    if(this.type==='fighter'){ p.jArmL.rotation.x=-1.6; p.jArmLF.rotation.x=-1.4; p.jArmL.rotation.z=0.3;
      p.jArmR.rotation.x=-1.5; p.jArmRF.rotation.x=-1.4; p.jArmR.rotation.z=-0.3; }
    else { p.jArmL.rotation.x=-0.5; p.jArmLF.rotation.x=-0.9; p.jArmR.rotation.x=-0.3+s*0.2; }
    // 발소리
    if(Math.sin(this.anim*10*sp)>0.98 && this.anim-this._lastStep>0.15){ this._lastStep=this.anim; Sound.step(0.6); }
  }
  poseWindup(){
    const p=this.parts, k=Math.min(1,this.t/0.16);
    if(this.currentMove==='kick'){
      p.jLegR.rotation.x=-0.6*k; this.g.rotation.z=this.dir*0.1*k;
    } else if(this.type==='fighter'){
      p.jArmR.rotation.x=-1.9*k; p.jArmRF.rotation.x=-1.0; this.g.rotation.y+=this.dir*-0.3*k;
      p.jArmL.rotation.x=-1.7; p.jArmLF.rotation.x=-1.4;
    } else {
      p.jArmR.rotation.x=-2.4*k; p.jArmR.rotation.z=-0.3; p.jArmRF.rotation.x=-0.6; // 검 치켜듦
      p.jArmL.rotation.x=-0.6; p.jArmLF.rotation.x=-1.0;
      this.g.rotation.y+=this.dir*-0.2*k;
    }
  }
  poseAttack(foe){
    const p=this.parts, k=Math.min(1,this.t/0.12); // 빠른 스트라이크
    if(this.currentMove==='kick'){
      p.jLegR.rotation.x=1.4*k; p.jLegRF.rotation.x=-0.3*(1-k); this.g.rotation.z=this.dir*0.35*k;
      p.jArmL.rotation.x=-1.4; p.jArmR.rotation.x=-1.0;
    } else if(this.type==='fighter'){ // 스트레이트 펀치: 뒤로 당겼다 쭉 뻗음
      p.jArmR.rotation.x = -0.1 - (1-k)*1.6; p.jArmRF.rotation.x = -0.2*(1-k);
      p.jArmL.rotation.x=-1.7; p.jArmLF.rotation.x=-1.4;
      this.g.rotation.y = (this.x<foe.x?Math.PI/2:-Math.PI/2) + this.dir*0.15*k;
    } else { // 내려베기
      p.jArmR.rotation.x=-2.4 + 3.0*k; p.jArmR.rotation.z=-0.1; p.jArmRF.rotation.x=-0.2;
      p.jArmL.rotation.x=-0.6; p.jArmLF.rotation.x=-1.0;
      this.g.rotation.y = (this.x<foe.x?Math.PI/2:-Math.PI/2) + this.dir*0.1*k;
    }
    p.jLegL.rotation.x=0.2; p.jLegR.rotation.x=-0.2;
  }
  poseHurt(dt){
    const p=this.parts, k=Math.min(1,this.t/0.25);
    this.g.rotation.z=this.dir*(-0.35)*(1-k)*Math.sign(this.knock||1);
    p.head.rotation.x=-0.3*(1-k); p.head.rotation.z=0.2*(1-k);
    p.jArmL.rotation.x=-1.0*(1-k)-0.3; p.jArmR.rotation.x=0.6*(1-k)-0.3;
    // 넉백 이동
    if(this.knock){ this.g.position.x += this.knock*dt*3; this.knock*=(1-dt*6); }
  }
  poseBlock(){
    const p=this.parts;
    if(this.type==='roman'){ p.jArmL.rotation.x=-1.2; p.jArmLF.rotation.x=-0.5; this.g.rotation.z=this.dir*0.1; }
    else { p.jArmL.rotation.x=-1.9; p.jArmLF.rotation.x=-1.6; p.jArmR.rotation.x=-1.9; p.jArmRF.rotation.x=-1.6; }
  }
  moveToward(foe,dt){
    const d=foe.x-this.x, dist=Math.abs(d);
    if(dist>this.reach){ this.g.position.x += Math.sign(d)*this.speed*dt; }
    this.faceTo(foe.x);
  }
  moveAway(foe,dt){
    const d=this.x-foe.x;
    let nx=this.x + Math.sign(d)*this.speed*0.8*dt;
    nx=Math.max(-9,Math.min(9,nx)); this.g.position.x=nx;
    this.faceTo(foe.x);
  }
}

/* ---- 히트 이펙트: 스파크 파티클 ---- */
const sparks=[];
const sparkGeo=new THREE.SphereGeometry(0.09,6,5);
function burst(pos, color=0xffcc44, n=18, power=1){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({color}));
    m.position.copy(pos);
    const a=Math.random()*Math.PI*2, e=Math.random()*Math.PI-Math.PI/2;
    const sp=(2+Math.random()*4)*power;
    m.userData.v=new THREE.Vector3(Math.cos(a)*Math.cos(e),Math.abs(Math.sin(e))*1.5+0.5,Math.sin(a)*Math.cos(e)).multiplyScalar(sp);
    m.userData.life=0.5+Math.random()*0.3; m.userData.age=0;
    scene.add(m); sparks.push(m);
  }
}
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.userData.age+=dt;
    if(s.userData.age>=s.userData.life){ scene.remove(s); sparks.splice(i,1); continue; }
    s.userData.v.y-=14*dt; s.position.addScaledVector(s.userData.v,dt);
    const k=1-s.userData.age/s.userData.life; s.scale.setScalar(k); }
}

// 충격 링 (임팩트 순간 확장)
const rings=[];
function shockRing(pos,color=0xffffff){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.1,0.25,24),
    new THREE.MeshBasicMaterial({color,transparent:true,side:THREE.DoubleSide}));
  m.position.copy(pos); m.lookAt(camera.position); m.userData.age=0; scene.add(m); rings.push(m);
}
function updateRings(dt){
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.userData.age+=dt;
    if(r.userData.age>0.4){ scene.remove(r); rings.splice(i,1); continue; }
    const k=r.userData.age/0.4; r.scale.setScalar(1+k*7); r.material.opacity=1-k; }
}

function shake(mag){ shakeT=0.35; shakeMag=mag; }

/* ---- AI 결정 로직 ---- */
function decide(self, foe){
  const dist=Math.abs(foe.x-self.x);
  if(self.state!=='idle' && self.state!=='recover' && self.state!=='approach' && self.state!=='retreat' && self.state!=='block') return;
  if(self.cooldown>0) return;

  if(dist>self.reach){
    self.state='approach'; self.t=0; return;
  }
  // 사거리 안 — 상대가 공격중이면 방어 확률
  if((foe.state==='windup'||foe.state==='attack') && Math.random()<0.35){
    self.state='block'; self.t=0; self._blockDur=0.4; return;
  }
  // 공격 개시
  self.currentMove = (self.type==='fighter' && Math.random()<0.35)?'kick':'strike';
  self.state='windup'; self.t=0; self._struck=false;
  self.cooldown = self.type==='roman'? 0.9+Math.random()*0.6 : 0.6+Math.random()*0.4;
  Sound.whoosh(0.8);
  if(self.currentMove==='kick') Sound.whoosh(1);
}

function resolveAttack(self, foe){
  // 임팩트 프레임: attack 상태 진입 후 0.10s
  if(self.state==='attack' && !self._struck && self.t>=0.06){
    self._struck=true;
    const dist=Math.abs(foe.x-self.x);
    const inRange = dist <= self.reach+0.8;
    // 상대 방어 판정
    if(inRange && (foe.state==='block')){
      // 막힘!
      const hpos=new THREE.Vector3((self.x+foe.x)/2, 2.9, 0.4);
      if(self.type==='roman'){ Sound.clang(1.1); shockRing(hpos,0xfff0b0); burst(hpos,0xfff0b0,14,0.7); }
      else { Sound.clang(0.7); burst(hpos,0xcfe0ff,8,0.5); }
      shake(0.25); log(`🛡️ ${foe.name} 막아냄!`);
      return;
    }
    if(inRange){
      const crit=Math.random()<self.critChance;
      let dmg = self.dmgMin+Math.random()*(self.dmgMax-self.dmgMin);
      if(crit) dmg*=1.9;
      dmg=Math.round(dmg);
      const hpos=foe.g.position.clone(); hpos.y=2.9; hpos.x+=self.dir*0.3;
      foe.takeHit(dmg, crit, self.x);
      // 연출
      if(self.type==='roman'){ Sound.slash(crit?1.2:0.9); }
      else { Sound.punch(crit?1.2:0.9); }
      burst(hpos, crit?0xff3b2f:0xffbb44, crit?30:18, crit?1.6:1);
      shockRing(hpos, crit?0xff5a4d:0xffffff);
      spawnDamage(hpos, dmg, crit);
      shake(crit?1.0:0.5);
      hitStop = crit?0.14:0.07; // 히트스톱
      Sound.crowd(crit?1:0.5, crit?1.3:0.7);
      const moveTxt = self.currentMove==='kick'?'회심의 발차기!':
        (self.type==='roman'?'글라디우스 강타!':'스트레이트!');
      log(`${crit?'💥 크리티컬! ':''}${self.name} ${moveTxt} (-${dmg})`);
      if(crit) announce('CRITICAL!', '#ffdb4d');
    }
  }
}

/* ---- 상태 전이 (타이밍) ---- */
function advance(self, foe, dt){
  self.cooldown=Math.max(0,self.cooldown-dt);
  switch(self.state){
    case 'approach':
      if(Math.abs(foe.x-self.x)<=self.reach){ self.state='idle'; self.t=0; }
      break;
    case 'block':
      self._blockDur-=dt; if(self._blockDur<=0){ self.state='idle'; self.t=0; }
      break;
    case 'windup':
      if(self.t>=0.16){ self.state='attack'; self.t=0; self._struck=false; }
      break;
    case 'attack':
      resolveAttack(self, foe);
      if(self.t>=0.18){ self.state='recover'; self.t=0; }
      break;
    case 'recover':
      if(self.t>=0.18){ self.state='idle'; self.t=0; }
      break;
    case 'hurt':
      if(self.t>=0.28){ self.state='idle'; self.t=0; self.knock=0; }
      break;
  }
}

/* ============================================================
   5. 메인 루프
   ============================================================ */
let last=performance.now();
function loop(nowMs){
  requestAnimationFrame(loop);
  let dt=(nowMs-last)/1000; last=nowMs; dt=Math.min(dt,0.05);

  // 슬로우모/히트스톱
  let sim=dt*slowmo;
  if(hitStop>0){ hitStop-=dt; sim*=0.08; }

  if(running && fighter.state!=='ko' && roman.state!=='ko'){
    matchTime+=sim; roundTimer-=sim;
    decide(fighter,roman); decide(roman,fighter);
    advance(fighter,roman,sim); advance(roman,fighter,sim);
    updateHP();
    UI.timer.textContent=Math.max(0,Math.ceil(roundTimer));

    // 승패 판정
    if(fighter.hp<=0 || roman.hp<=0){ endMatch(); }
    else if(roundTimer<=0){ endMatch(true); }
    // 경계 밀림 방지
    fighter.g.position.x=Math.max(-9,Math.min(9,fighter.g.position.x));
    roman.g.position.x=Math.max(-9,Math.min(9,roman.g.position.x));
  }

  if(fighter) fighter.update(sim, roman);
  if(roman)   roman.update(sim, fighter);
  updateSparks(sim); updateRings(sim);

  // 카메라: 두 파이터 중심 추적 + 셰이크
  const cx=((fighter?fighter.x:0)+(roman?roman.x:0))/2;
  const gap=Math.abs((fighter?fighter.x:0)-(roman?roman.x:0));
  const camZ=13+gap*0.5;
  camera.position.x += ((cx*0.4)-camera.position.x)*0.06;
  camera.position.z += (camZ-camera.position.z)*0.04;
  camera.position.y += (6.2-camera.position.y)*0.05;
  if(shakeT>0){ shakeT-=dt; const s=shakeMag*(shakeT/0.35);
    camera.position.x+=(Math.random()-0.5)*s; camera.position.y+=(Math.random()-0.5)*s; }
  camera.lookAt(cx*0.4, 2.6, 0);

  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

/* ============================================================
   6. 매치 시작/종료 · 입력
   ============================================================ */
function startMatch(){
  Sound.init(); Sound.resume(); Sound.bell(); Sound.crowd(1,1.6);
  buildCombatants(); updateHP();
  running=true; matchTime=0; roundTimer=60; slowmo=1;
  UI.overlay.classList.add('hidden'); UI.title.classList.add('hidden');
  UI.startBtn.classList.add('hidden'); UI.againBtn.classList.add('hidden');
  UI.resultText.classList.add('hidden');
  UI.hud.classList.remove('hidden'); UI.hint.classList.remove('hidden');
  UI.log.innerHTML='';
  announce('FIGHT!', '#ff5a4d');
  setTimeout(()=>Sound.gong&&null,0);
}

function endMatch(timeout=false){
  if(!running) return; running=false;
  Sound.gong(); Sound.crowd(1.2,2.0);
  let winner, color;
  if(timeout){
    if(fighter.hp>roman.hp){ winner=fighter; } else if(roman.hp>fighter.hp){ winner=roman; }
  } else {
    winner = fighter.hp<=0 ? roman : fighter;
    (fighter.hp<=0?fighter:roman).state='ko';
    (fighter.hp<=0?fighter:roman).t=0;
  }
  color = winner? (winner.side==='L'?'#ff5a4d':'#ffd35a') : '#ffffff';
  const txt = winner? `${winner.name} 승리!` : '무승부!';
  announce('K.O.', '#ff3b2f');
  setTimeout(()=>{
    UI.overlay.classList.remove('hidden');
    UI.resultText.textContent=txt; UI.resultText.style.color=color;
    UI.resultText.classList.remove('hidden');
    UI.againBtn.classList.remove('hidden');
    // 승자 세리머니: 계속 idle 바운스는 update가 처리
  }, 1400);
  log(winner? `🏆 ${winner.name} 승리!` : '무승부');
}

UI.startBtn.addEventListener('click', startMatch);
UI.againBtn.addEventListener('click', startMatch);
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); slowmo = slowmo<1?1:0.25; }
  if(e.key==='r'||e.key==='R'){ if(!running) startMatch(); }
});

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// 초기 프리뷰: 아레나에 두 파이터 세워두기
buildCombatants();
fighter.g.position.x=-4; roman.g.position.x=4;
fighter.faceTo(roman.x); roman.faceTo(fighter.x);
UI.loading.classList.add('hidden');
UI.startBtn.classList.remove('hidden');
</script>
